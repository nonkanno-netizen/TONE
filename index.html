<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TONE｜あなたらしさ発見テスト</title>
<style>
body{font-family: sans-serif;background:linear-gradient(135deg,#fff5f0,#f5f0ff,#edf8f1);color:#51485c;padding:20px}
main{max-width:500px;margin:20px auto;background:white;padding:24px;border-radius:24px}
h1{text-align:center;color:#8069a2;font-size:25px}
p{line-height:1.8}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:14px;background:#e8ddf7;color:#51485c;font-size:16px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>T O N E 🌷<br>あなたらしさ発見テスト</h1>
<p id="intro">10個の質問から、あなたの考え方や行動のTONEを見つけよう！正解はないよ。直感で選んでね。</p>
<div id="quiz" class="hidden">
<p id="count"></p><h3 id="question"></h3>
<button id="a" onclick="answer(0)"></button>
<button id="b" onclick="answer(1)"></button>
</div>
<div id="result" class="hidden"></div>
<button id="start" onclick="begin()">診断スタート ✨</button>
</main>
<script>
const qs=[
["予定が急にキャンセルになったら？","残念！楽しみにしていた","自由時間ができた！"],
["人から褒められたら？","素直にうれしい","本当かな？と考える"],
["嫌なことをされたら？","まず感情が動く","理由を考える"],
["やることが多いときは？","まず始めてみる","順番を考えてから"],
["急に遊びに誘われたら？","楽しそう！行きたい","予定や気分を考える"],
["準備が終わっていない！","多少足りなくても出発","できるだけ準備する"],
["LINEの返信が遅いときは？","忙しいのかな","何かあったのかな"],
["お願いをされたら？","つい引き受ける","自分の都合も考える"],
["好きな人に会いたいと言われたら？","うれしい！会いたい","どうしたんだろう？"],
["自分に近いのは？","まず行動する","まず考える"]
];
let n=0,score=0;
function begin(){
n=0;score=0;
document.getElementById("intro").classList.add("hidden");
document.getElementById("start").classList.add("hidden");
document.getElementById("result").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
show();
}
function show(){
document.getElementById("count").textContent="質問 "+(n+1)+" / 10";
document.getElementById("question").textContent=qs[n][0];
document.getElementById("a").textContent="A："+qs[n][1];
document.getElementById("b").textContent="B："+qs[n][2];
}
function answer(v){
score+=v===0?1:0;n++;
if(n<qs.length){show();return;}
document.getElementById("quiz").classList.add("hidden");
let title,desc;
if(score>=7){title="⚡ 直感アクションTONE";desc="ひらめきや気持ちを大切にして行動できるタイプ。行動力と素直さが魅力！";}
else if(score<=3){title="🧠 じっくり思考TONE";desc="状況や相手の気持ちを考えて判断するタイプ。慎重さと分析力が魅力！";}
else{title="🌿 バランスTONE";desc="直感と慎重さを使い分けられるタイプ。柔軟性と適応力が魅力！";}
document.getElementById("result").innerHTML="<h2>"+title+"</h2><p>"+desc+"</p><p>※モニター版の簡易診断です。</p><button onclick='begin()'>もう一度診断する</button>";
document.getElementById("result").classList.remove("hidden");
document.getElementById("start").classList.remove("hidden");
document.getElementById("start").textContent="最初に戻る";
}
</script>
</body>
</html>
