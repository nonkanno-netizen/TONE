<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TONE | あなたらしさを知る2択診断</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f3f5;color:#49434a;font-family:Arial,"Yu Gothic",Meiryo,sans-serif;line-height:1.8}
main{max-width:680px;margin:auto;padding:22px 16px 50px}
header{text-align:center;padding:20px 0}
.logo{font-family:Georgia,serif;font-size:52px;letter-spacing:9px;color:#a47e91;margin:0}
.subtitle{font-size:13px;color:#887b87}
.card{background:white;border-radius:22px;padding:23px;margin:14px 0;box-shadow:0 5px 25px #78607812}
h2{font-size:23px;line-height:1.5;margin:8px 0 15px}
p{margin:10px 0}
.muted{color:#807781;font-size:14px}
.label{font-size:12px;letter-spacing:2px;color:#a47e91;font-weight:bold}
button,select{font:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:14px}
.primary{width:100%;background:#a47e91;color:white;font-weight:bold;margin-top:15px}
.choice{width:100%;background:#fffafa;border:1px solid #eadfe6;text-align:left;margin:6px 0;color:#49434a}
.choice:hover{background:#f8edf3;border-color:#c7a2b6}
select{width:100%;padding:12px;border:1px solid #e7dce3;border-radius:12px;background:white;margin:5px 0 16px}
.progress{height:6px;background:#eee7ed;border-radius:8px;margin:15px 0 24px;overflow:hidden}
#bar{height:100%;width:0;background:#bc91a8}
.hidden{display:none!important}
.typebox{border-radius:18px;padding:18px;margin:15px 0;background:#faf5f8}
.symbol{font-size:46px;line-height:1.2}
.typeName{font-family:Georgia,serif;font-size:28px;letter-spacing:2px}
.score{font-size:40px;color:#a47e91;font-weight:bold;text-align:center}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1;background:#f2eaf0;color:#6f586a}
footer{text-align:center;font-size:11px;color:#a99ba6;padding:20px}
</style>
</head>
<body>
<main>
<header>
<p class="label">FIND YOUR TONE</p>
<h1 class="logo">TONE</h1>
<p class="subtitle">ちがいを知ると、自分にも相手にもやさしくなれる。</p>
</header>

<section id="home" class="card">
<p class="label">SELF DISCOVERY</p>
<h2>あなたらしさを見つけよう。</h2>
<p class="muted">10問の2択に答えるだけ。正解はないので、直感で選んでね。</p>
<label for="mode">診断の種類</label>
<select id="mode">
<option value="solo">ひとりで性格診断</option>
<option value="pair">ふたりで相性診断</option>
</select>
<label for="relation">ふたりの関係</label>
<select id="relation">
<option value="love">恋愛・パートナー</option>
<option value="friend">友達・家族</option>
</select>
<button class="primary" id="start">診断スタート →</button>
</section>

<section id="quiz" class="card hidden">
<p class="label" id="counter">QUESTION 1 / 10</p>
<div class="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div id="answers"></div>
<p class="muted">深く考えすぎず、今の自分に近い方を選んでね。</p>
</section>

<section id="pass" class="card hidden">
<p class="label">NEXT PLAYER</p>
<h2>Bさんの番だよ！</h2>
<p>端末をBさんに渡して、本人の感覚で答えてもらってね。</p>
<button class="primary" id="startB">Bさんの診断を始める →</button>
</section>

<section id="result" class="card hidden">
<p class="label">YOUR TONE</p>
<div id="resultContent"></div>
<div class="actions">
<button id="copy">結果をコピー</button>
<button id="again">もう一度診断</button>
</div>
<p id="notice" class="muted"></p>
</section>
<footer>TONE · Understand yourself, understand each other.</footer>
</main>

<script>
(function(){
"use strict";

const questions=[
["予定より早く準備が終わった。出発まで30分ある。","忘れ物がないかもう一度確認する","お茶でも飲んでゆっくり待つ","LEAF","MOON"],
["友達から急に「今から会える？」と連絡が来た。","行けるならすぐ準備する","予定や気分を確認して決める","SUN","MOON"],
["誰かに褒められたときは？","素直にうれしさを伝える","照れながら、どこがよかったか考える","ROSE","STAR"],
["苦手なことを頼まれたら？","できる範囲を整理して対応する","やり方を工夫して取り組む","LEAF","WAVE"],
["予定が急に変更になったら？","新しい予定も楽しめるよう切り替える","まず気持ちや段取りを整える","SUN","MOON"],
["友達が落ち込んでいるときは？","気持ちに寄り添って話を聞く","別の視点やアイデアを一緒に探す","ROSE","STAR"],
["休日の理想に近いのは？","気分に合わせて自由に過ごす","ひとり時間を大切にして過ごす","WAVE","MOON"],
["誰かと意見が違ったときは？","相手の気持ちも考えて話し合う","事実や約束を整理して考える","ROSE","LEAF"],
["新しいことを始めるときは？","まずやってみる","様子を見ながら進める","SUN","WAVE"],
["気になるものを見つけたときは？","自分なりに深く調べてみる","確かな情報や経験を参考にする","STAR","LEAF"]
];

const types={
ROSE:{symbol:"✿",ja:"つながりを育てる人",color:"#b77e94",bg:"#f8e9ef",good:"共感力・あたたかさ",desc:"相手の気持ちを大切にし、心の距離を縮めるのが得意。思いやりが自然に行動に表れます。",tip:"相手を優先しすぎず、自分の気持ちも言葉にしてみて。"},
MOON:{symbol:"☾",ja:"自分のリズムを大切にする人",color:"#9383b6",bg:"#efebf8",good:"内省・落ち着き",desc:"自分の内側を見つめ、じっくり考えるタイプ。自分のペースを守ることで力を発揮します。",tip:"考えがまとまる前でも、少し共有すると伝わりやすいよ。"},
SUN:{symbol:"☼",ja:"動いて道をひらく人",color:"#b99a50",bg:"#faf3dd",good:"行動力・前向きさ",desc:"まず一歩踏み出し、経験しながら前に進むタイプ。周りにも明るい勢いを届けます。",tip:"自分とスピードが違う人を待つことも大切に。"},
LEAF:{symbol:"❧",ja:"安心を積み重ねる人",color:"#789579",bg:"#eaf2e9",good:"誠実さ・安定感",desc:"約束や日々の積み重ねを大切にするタイプ。誠実さと安定感で周りを支えます。",tip:"いつもと違う方法も、試しに少し取り入れてみて。"},
STAR:{symbol:"✦",ja:"好奇心で世界を広げる人",color:"#7291b2",bg:"#eaf1f8",good:"好奇心・独自の視点",desc:"発見を楽しみ、自分ならではの視点を持つタイプ。新しい可能性を見つけるのが得意です。",tip:"アイデアを小さな一歩にすると、魅力がさらに伝わるよ。"},
WAVE:{symbol:"〰",ja:"柔らかく調整する人",color:"#65a29c",bg:"#e7f4f1",good:"柔軟性・調整力",desc:"状況に合わせて柔軟に動き、バランスをとるタイプ。変化の中でも自分の流れを見つけます。",tip:"周りに合わせるだけでなく、自分の希望も確かめてみて。"}
};

const $=id=>document.getElementById(id);
let mode="solo",relation="love",player="A",answers=[],aType=[],bType=[],shareText="";

function show(id){
["home","quiz","pass","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
window.scrollTo(0,0);
}

function rankTypes(ans){
const scores={ROSE:0,MOON:0,SUN:0,LEAF:0,STAR:0,WAVE:0};
ans.forEach((choice,i)=>{
const type=questions[i][choice===0?3:4];
scores[type]++;
});
return Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||Object.keys(types).indexOf(a)-Object.keys(types).indexOf(b));
}

function renderQuestion(){
const i=answers.length;
$("counter").textContent="QUESTION "+(i+1)+" / "+questions.length;
$("bar").style.width=(i/questions.length*100)+"%";
$("question").textContent=questions[i][0];
$("answers").innerHTML="";
[0,1].forEach(n=>{
const btn=document.createElement("button");
btn.className="choice";
btn.textContent=(n===0?"① ":"② ")+questions[i][n+1];
btn.addEventListener("click",()=>{
answers.push(n);
if(answers.length<questions.length){renderQuestion();}
else{finishPlayer();}
});
$("answers").appendChild(btn);
});
}

function finishPlayer(){
if(mode==="pair"&&player==="A"){
aType=rankTypes(answers);
player="B";
answers=[];
show("pass");
return;
}
if(mode==="pair"){
bType=rankTypes(answers);
renderPair();
}else{
renderSolo(rankTypes(answers));
}
show("result");
}

function typeHTML(id,sub){
const t=types[id];
return '<div class="typebox" style="background:'+t.bg+';color:#49434a">'+
'<div class="symbol" style="color:'+t.color+'">'+t.symbol+'</div>'+
'<div class="typeName" style="color:'+t.color+'">'+t.name+'</div>'+
'<h2>'+t.ja+'</h2><p>'+t.desc+'</p>'+
'<p><strong>あなたの強み：</strong>'+t.good+'</p>'+
(sub?"":'<p><strong>ヒント：</strong>'+t.tip+'</p>')+
'</div>';
}

function renderSolo(rank){
shareText="TONE診断結果："+rank[0]+"（"+types[rank[0]].ja+"）／サブ："+rank[1]+"（"+types[rank[1]].ja+"）";
$("resultContent").innerHTML="<h2>あなたのメインタイプ</h2>"+typeHTML(rank[0],false)+
"<h2>もうひとつのあなたらしさ</h2>"+typeHTML(rank[1],true)+
'<p class="muted">タイプは性格を決めつけるものではなく、自分を知るためのヒントです。</p>';
}

function renderPair(){
const a=aType[0],b=bType[0];
const shared=a===b;
const secondary=aType[1]===b||bType[1]===a;
const score=shared?92:secondary?82:78;
const ta=types[a],tb=types[b];
shareText="TONE相性診断：Aさん "+a+"（"+ta.ja+"）／Bさん "+b+"（"+tb.ja+"）／相性スコア "+score;
const relationText=relation==="love"?"ふたりの関係を育てるヒント":"お互いを活かすヒント";
const message=shared?
"似た感覚を持ちやすいふたり。安心感がある一方、同じところで迷うことも。":
secondary?
"大切にしていることに共通点がありそう。似ている部分をきっかけに、違いも楽しく知っていけそう。":
"感じ方や得意なことに違いがありそう。相手を自分と同じにしようとせず、違いを活かすのがコツ。";
$("resultContent").innerHTML=
'<h2>ふたりのTONE</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
'<div class="typebox" style="background:'+ta.bg+'"><div class="symbol" style="color:'+ta.color+'">'+ta.symbol+'</div><b>Aさん · '+a+'</b><p>'+ta.ja+'</p></div>'+
'<div class="typebox" style="background:'+tb.bg+'"><div class="symbol" style="color:'+tb.color+'">'+tb.symbol+'</div><b>Bさん · '+b+'</b><p>'+tb.ja+'</p></div></div>'+
'<div class="score">'+score+' / 100</div><p style="text-align:center" class="muted">相性の目安</p><h2>'+relationText+'</h2><p>'+message+'</p>'+
'<p class="muted">Aさんへ：'+ta.tip+'<br>Bさんへ：'+tb.tip+'</p>'+
'<p class="muted">※お試し版のゲーム内スコアであり、科学的な相性判定ではありません。</p>';
}

$("start").addEventListener("click",()=>{
mode=$("mode").value;
relation=$("relation").value;
player="A";answers=[];aType=[];bType=[];
renderQuestion();show("quiz");
});
$("startB").addEventListener("click",()=>{
answers=[];renderQuestion();show("quiz");
});
$("again").addEventListener("click",()=>{
answers=[];aType=[];bType=[];player="A";show("home");
});
$("copy").addEventListener("click",()=>{
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(shareText).then(()=>{
$("notice").textContent="結果をコピーしたよ！メッセージに貼り付けてね。";
}).catch(()=>fallbackCopy());
}else{fallbackCopy();}
});
function fallbackCopy(){
const area=document.createElement("textarea");
area.value=shareText;document.body.appendChild(area);
area.select();
try{document.execCommand("copy");$("notice").textContent="結果をコピーしたよ！";}
catch(e){$("notice").textContent=shareText;}
area.remove();
}
})();
</script>
</body>
</html>
